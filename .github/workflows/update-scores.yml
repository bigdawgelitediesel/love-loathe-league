name: Update scores

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-scores.mjs
      - name: Commit if scores changed
        run: |
          if [ -n "$(git status --porcelain scores.json)" ]; then
            git config user.name "scores-bot"
            git config user.email "scores-bot@users.noreply.github.com"
            git add scores.json
            git commit -m "Update scores"
            git push
          fi
