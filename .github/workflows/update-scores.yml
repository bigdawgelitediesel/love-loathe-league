name: Update scores

on:
  # Midnight Mountain time. GitHub cron is UTC, so run at both 06:00 (MDT) and
  # 07:00 (MST) and let the time check below skip whichever one isn't midnight.
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update scores (skip the 11pm run in winter)
        run: |
          HOUR=$(TZ=America/Denver date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" = "23" ]; then
            echo "It's 11pm in Cheyenne, the midnight run will handle it."
          else
            node scripts/update-scores.mjs
          fi
      - name: Commit if scores changed
        run: |
          if [ -n "$(git status --porcelain scores.json)" ]; then
            git config user.name "scores-bot"
            git config user.email "scores-bot@users.noreply.github.com"
            git add scores.json
            git commit -m "Update scores"
            git push
          fi
